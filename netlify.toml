[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Roda a cada 2 horas, buscando jogos finalizados hoje e ontem, salvando no Supabase.
[functions."atualizar-jogos-finalizados"]
  schedule = "0 */2 * * *"

# Roda todo dia às 23:59 (horário de São Paulo, sem horário de verão desde 2019 = UTC-3
# fixo) e apaga os jogos agendados do dia — essa lista é só o "quadro" de hoje, não é
# histórico, então não precisa acumular linha no banco pra sempre.
[functions."limpar-jogos-agendados"]
  schedule = "59 2 * * *"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
